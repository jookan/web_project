<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="web_programming/css/ambient_theme.css">
<link rel="stylesheet" href="web_programming/css/ambient_navigation.css">
<script src="scripts/ambient_session.js" defer></script>
<title>글쓰기 - Ambient</title>
<link rel="stylesheet" href="web_programming/css/community_.css">
</head>
<body class="community-page">
  <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
  <div class="vignette" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="ambient_hub.html"><span class="brand-mark" aria-hidden="true"></span>Ambient</a>
    <nav class="primary-nav" aria-label="사이트 메뉴">
      <a href="ambient_hub.html">시작</a>
      <a href="digging.html">음악 디깅</a>
      <a href="community.html" aria-current="location">커뮤니티</a>
      <a href="aurora.html">Aurora</a>
      <a href="sheet_uploading.html">악보 연습</a>
    </nav>
    <span class="user-area" id="userArea"></span>
  </header>

  <main class="page-shell">
    <div class="page-heading">
      <span class="eyebrow">WRITE A STORY</span>
      <h1>당신의 음악 이야기를 들려주세요.</h1>
      <p>추천하고 싶은 곡이나 함께 나누고 싶은 순간을 기록해 보세요.</p>
    </div>
  <section class="write-page">
    <h2>글쓰기</h2>

    <label for="category">카테고리 선택</label>
    <select id="category" name="category">
      <option value="song">곡 추천</option>
      <option value="sheet">악보 공유</option>
      <option value="free">자유</option>
    </select>

    <label for="postText">내용</label>
    <textarea id="postText" rows="8" placeholder="무슨 곡 이야기를 나눠볼까요?"></textarea>

    <label for="fileInput">파일 정보 첨부 (원본은 이 브라우저에 보관, 최대 3개·5MB 이하)</label>
    <input type="file" id="fileInput" multiple>
    <ul class="file-list" id="fileList"></ul>

    <p class="write-hint" id="writeHint"></p>

    <div class="write-actions">
      <a class="btn-cancel" id="cancelBtn" href="community.html">취소</a>
      <button type="button" id="submitPost">등록</button>
    </div>
  </section>
  </main>


  <script type="module" src="scripts/community_write_.js"></script>
</body>
</html>
