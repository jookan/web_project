<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset = "UTF-8">
    <meta name = "author" content = "Lee Yechan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambient · 음악 디깅</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="web_programming/css/ambient_theme.css">
    <link rel="stylesheet" href="web_programming/css/ambient_navigation.css">
    <link rel = "stylesheet" href = "web_programming/css/digging.css">
    <script src="scripts/ambient_session.js" defer></script>
    <script src="scripts/community_common_.js" defer></script>
    <script src = "scripts/config.js" defer></script>
    <script src = "scripts/digging.js" defer></script>
</head>
<body class="discovery-page">
    <div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="site-header">
        <a class="brand" href="ambient_hub.html"><span class="brand-mark" aria-hidden="true"></span>Ambient</a>
        <nav class="primary-nav" aria-label="사이트 메뉴">
            <a href="ambient_hub.html">시작</a>
            <a href="digging.html" aria-current="page">음악 디깅</a>
            <a href="community.html">커뮤니티</a>
            <a href="aurora.html">Aurora</a>
            <a href="sheet_uploading.html">악보 연습</a>
        </nav>
        <span class="user-area" id="userArea"></span>
    </header>
    <main class="page-shell">
        <div class="page-heading">
            <span class="eyebrow">MUSIC DISCOVERY</span>
            <h1>취향을 따라, 새로운 음악으로.</h1>
            <p>좋아하는 곡을 모으고, 익숙한 장르와 새로운 장르를 함께 탐색해 보세요.</p>
        </div>
        <section class="discovery-search" aria-label="음악 검색">
            <form class="search_login_form" role="search">
                <label class="visually-hidden" for="songSearch">가수 또는 노래 제목</label>
                <span class="search-symbol" aria-hidden="true">⌕</span>
                <input id="songSearch" type="search" class="input_box" placeholder="가수나 노래 제목으로 검색" autocomplete="off" aria-controls="searchResults">
                <button type="submit">검색</button>
            </form>
        </section>
        <div class="discovery-layout">
            <aside class="playlist box" aria-labelledby="playlistTitle">
                <div class="playlist-heading"><span class="eyebrow">MY COLLECTION</span><h2 id="playlistTitle">플레이리스트</h2></div>
            </aside>
            <div class="playlist_recommendation">
                <section class="recommendation_section box" aria-label="비슷한 장르 추천">
                    <h3>플레이리스트와 비슷한 장르</h3>
                    <div></div>
                </section>
                <section class="recommendation_section box" aria-label="다른 장르 추천">
                    <h3>플레이리스트와 다른 장르</h3>
                    <div></div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
