<!DOCTYPE html>
<html lang = "ko">
<head>
    <meta charset = "UTF-8">
    <meta name = "author" content = "Lee Yechan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel = "stylesheet" href = "web_programming/css/home.css">
</head>
<body>
    <header>
        <form class = "search_login_form">
            <input type = "text" class = "input_box box" placeholder = "검색">
            <button type = "button" class = "login_button box">로그인</button>
        </form>
    </header>
    <nav class = "playlist box">
        <h3>플레이리스트</h3>
    </nav>
    <section>
        <article>
            <div class = "playlist_recommendation">
                <div class = "recommendation_section box">
                    <h3>플레이리스트와 비슷한 장르</h3>
                    <div>
                        <p>노래 1 <button type="button">+</button></p>
                        <p>노래 2 <button type="button">+</button></p>
                        <p>노래 3 <button type="button">+</button></p>
                    </div>
                </div>
                <div class = "recommendation_section box">
                    <h3>플레이리스트와 다른 장르</h3>
                    <div>
                        <p>노래 1 <button type="button">+</button></p>
                        <p>노래 2 <button type="button">+</button></p>
                        <p>노래 3 <button type="button">+</button></p>
                    </div>
                </div>
            </div>
        </article>
    </section>
</body>
</html>
