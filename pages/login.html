<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>로그인 - MusicDig</title>
<link rel="stylesheet" href="web_programming/css/login_.css">
</head>
<body>
  <div class="hero">
    <h1>🎵 MusicDig</h1>
    <h2>나만의 플레이리스트, 악보 연습, 커뮤니티를 한 곳에서</h2>
    <ul>
      <li>내가 좋아하는 곡으로 나만의 플레이리스트를 만들어요</li>
      <li>좋아하는 곡의 악보를 올리고 바로 연습해요</li>
      <li>숨은 명곡을 커뮤니티에 공유해요</li>
    </ul>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <h2 id="formTitle">로그인</h2>
      <p class="sub" id="formSub">이메일과 비밀번호를 입력해주세요.</p>
      <form id="loginForm" novalidate>
        <div class="field-group">
          <input type="text" id="emailInput" name="userid" placeholder="이메일">
          <p class="error-msg" id="emailError"></p>
        </div>
        <div class="field-group">
          <div class="password-row">
            <input type="password" id="pwInput" name="password" placeholder="비밀번호">
            <button type="button" class="toggle-pw" id="togglePw">보기</button>
          </div>
          <p class="error-msg" id="pwError"></p>
        </div>
        <div class="field-group hidden" id="confirmGroup">
          <input type="password" id="pwConfirmInput" placeholder="비밀번호 확인">
          <p class="error-msg" id="confirmError"></p>
        </div>
        <div class="options" id="optionsRow">
          <label><input type="checkbox" id="keepLogin" name="keep"> 로그인 유지</label>
          <a href="#">비밀번호를 잊으셨나요?</a>
        </div>
        <input type="submit" id="submitBtn" value="로그인">
      </form>
      <button type="button" class="guest-btn" id="guestBtn">게스트로 둘러보기</button>
      <p class="signup" id="modeSwitch">계정이 없으신가요? <a href="#" id="modeLink">회원가입</a></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="scripts/login_.js"></script>
</body>
</html>
