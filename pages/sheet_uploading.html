<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="이주환">
        <title>악보 업로드 페이지</title>
        <link rel="stylesheet" href="web_programming/css/upload.css"/>
    </head>
    <body>
        <header class="header">
            <h1 class="default">악보 조회</h1>
        </header>

        <div class="main-container">
            <nav class="sidebar">
                <div class="select-box">
                    <h3>내 악보들</h3>
                    <div class="button-group">
                        <button type="button">악보 1</button>
                        <button type="button">악보 2</button>
                        <button type="button">악보 3</button>
                    </div>
                    <div class="upload-box">
                        <button type="button" class="btn-upload">악보 업로드</button>
                    </div>
                </div>
            </nav>

            <section class="content-section">
                <article>
                    <div class="sheet">
                        <img src="./imgs/test.jpg" alt="악보 이미지">
                    </div>
                </article>
                <footer class="sheet-footer">
                    <div class="controls">
                        <label>BPM <input type="number" class="short-input" value="120"></label>
                        <label>마디수 <input type="number" class="short-input" value="16"></label>
                        <button type="button">악보 넘기기 시작</button>
                        <br><br>
                        <span>메트로놈 소리 들려주기</span>
                        <button type="button">Yes</button>
                        <button type="button">No</button>
                    </div>
                </footer>
            </section>
        </div>
    </body>
</html>
